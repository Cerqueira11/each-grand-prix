<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e17" />
<title>EACH Grand Prix · celular</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/jogador.css" />
</head>
<body class="phone">
<header class="ptop">
  <div class="pbrand">🏁 EACH Grand Prix</div>
  <div class="pmeta"><span id="pRoom"></span><span id="pTeamBadge"></span></div>
</header>

<main class="pwrap">
  <!-- digitar o código, quando o link veio sem ?sala= -->
  <section id="pJoin" class="hide">
    <div class="pcard">
      <h2>Entrar na sala</h2>
      <p class="muted">Digite o código que aparece no telão.</p>
      <form id="joinForm" class="joinrow">
        <input id="joinCode" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" />
        <button class="btn green" type="submit">Entrar</button>
      </form>
    </div>
  </section>

  <!-- escolher a equipe -->
  <section id="pTeams" class="hide">
    <div class="pcard">
      <h2>Escolha a sua equipe</h2>
      <p class="muted">Só o líder do grupo entra. Cada equipe fica com um celular.</p>
      <div class="pteams" id="teamGrid"></div>
    </div>
  </section>

  <!-- mensagens de espera -->
  <section id="pWait" class="hide">
    <div class="pcard center">
      <div class="bigicon" id="waitIcon">⏳</div>
      <h2 id="waitTitle"></h2>
      <p class="muted" id="waitText"></p>
      <div id="waitExtra"></div>
    </div>
  </section>

  <!-- montar o carro -->
  <section id="pBuild" class="hide">
    <div class="pcard">
      <h2>Monte o seu carro</h2>
      <p class="muted" id="buildRules"></p>
      <details class="pinfo">
        <summary>Como funciona o leilão das peças Premium</summary>
        <p id="auctionHelp"></p>
      </details>
    </div>
    <div id="partList"></div>
    <div class="pbar">
      <div class="pbarline">
        <span id="sumPrem"></span><span id="sumMake"></span>
      </div>
      <div class="pbarline">
        <span>Sobra <strong id="sumLeft"></strong> de <span id="sumBudget"></span> moedas</span>
        <button class="btn green" id="btnSend">Enviar carro</button>
      </div>
      <div class="budgetbar" id="pBudgetBar"><div></div></div>
    </div>
  </section>

  <!-- corrida -->
  <section id="pRace" class="hide">
    <div class="pcard" id="aucBox"></div>
    <div class="pcard center">
      <div class="muted" id="raceLap"></div>
      <div class="bigpos" id="racePos"></div>
      <div class="muted" id="raceDist"></div>
    </div>
    <div class="pcard" id="raceCard"></div>
    <div class="pcard"><h3>Classificação</h3><div id="raceTable"></div></div>
  </section>

  <!-- pódio -->
  <section id="pResult" class="hide">
    <div class="pcard center">
      <div class="bigicon" id="resIcon"></div>
      <h2 id="resTitle"></h2>
      <div id="resBreak"></div>
    </div>
    <div class="pcard"><h3>Pódio</h3><div id="resTable"></div></div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/auction.js"></script>
<script type="module" src="js/jogador.js"></script>
</body>
</html>
